<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 120"
     preserveAspectRatio="none"
     role="img"
     aria-label="Ocean floor">
  <defs>
    <linearGradient id="sediment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0c1822" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- sediment with an uneven top edge -->
  <path d="M0,40
           C 80,32 160,50 240,40
           S 400,30 480,42
           S 640,52 720,38
           S 880,30 960,42
           S 1120,50 1200,40
           L 1200,120 L 0,120 Z"
        fill="url(#sediment)"/>

  <!-- low silhouette mounds -->
  <ellipse cx="280"  cy="74" rx="180" ry="14" fill="#04080e" opacity="0.85"/>
  <ellipse cx="720"  cy="80" rx="220" ry="17" fill="#04080e" opacity="0.85"/>
  <ellipse cx="1080" cy="72" rx="140" ry="11" fill="#04080e" opacity="0.85"/>

  <!-- bioluminescent specks (rare deep-sea life) -->
  <circle cx="160"  cy="50" r="1.3" fill="#5eead4" opacity="0.85"/>
  <circle cx="420"  cy="44" r="0.9" fill="#5eead4" opacity="0.7"/>
  <circle cx="600"  cy="52" r="1.1" fill="#5eead4" opacity="0.8"/>
  <circle cx="870"  cy="46" r="0.8" fill="#7dd3c0" opacity="0.65"/>
  <circle cx="1020" cy="50" r="1.0" fill="#5eead4" opacity="0.75"/>
</svg>
