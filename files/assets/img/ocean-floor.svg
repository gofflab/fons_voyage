<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 105"
     preserveAspectRatio="none"
     role="img"
     aria-label="Ocean floor">
  <defs>
    <linearGradient id="sediment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0c1822" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Sediment with an uneven top edge -->
  <path d="M0,30
           C 80,22 160,42 240,32
           S 400,20 480,36
           S 640,46 720,28
           S 880,18 960,34
           S 1120,42 1200,32
           L 1200,105 L 0,105 Z"
        fill="url(#sediment)"/>

  <!-- Sand grain texture: three shades of small specks scattered
       across the sediment -->
  <g fill="#1c2630" opacity="0.55">
    <circle cx="60"   cy="45" r="0.6"/>
    <circle cx="130"  cy="52" r="0.5"/>
    <circle cx="200"  cy="42" r="0.7"/>
    <circle cx="270"  cy="55" r="0.5"/>
    <circle cx="350"  cy="48" r="0.6"/>
    <circle cx="420"  cy="55" r="0.5"/>
    <circle cx="490"  cy="44" r="0.7"/>
    <circle cx="560"  cy="58" r="0.6"/>
    <circle cx="620"  cy="48" r="0.5"/>
    <circle cx="700"  cy="55" r="0.6"/>
    <circle cx="780"  cy="46" r="0.7"/>
    <circle cx="850"  cy="56" r="0.5"/>
    <circle cx="920"  cy="48" r="0.6"/>
    <circle cx="1000" cy="55" r="0.5"/>
    <circle cx="1080" cy="46" r="0.7"/>
    <circle cx="1150" cy="55" r="0.6"/>
  </g>
  <g fill="#142028" opacity="0.65">
    <circle cx="95"   cy="60" r="0.6"/>
    <circle cx="170"  cy="65" r="0.5"/>
    <circle cx="245"  cy="62" r="0.7"/>
    <circle cx="320"  cy="68" r="0.5"/>
    <circle cx="395"  cy="62" r="0.6"/>
    <circle cx="470"  cy="68" r="0.5"/>
    <circle cx="545"  cy="65" r="0.6"/>
    <circle cx="620"  cy="68" r="0.5"/>
    <circle cx="695"  cy="65" r="0.7"/>
    <circle cx="770"  cy="68" r="0.6"/>
    <circle cx="840"  cy="62" r="0.5"/>
    <circle cx="915"  cy="65" r="0.6"/>
    <circle cx="985"  cy="62" r="0.7"/>
    <circle cx="1055" cy="68" r="0.5"/>
    <circle cx="1125" cy="62" r="0.6"/>
  </g>
  <g fill="#08101a" opacity="0.7">
    <circle cx="45"   cy="75" r="0.5"/>
    <circle cx="115"  cy="82" r="0.6"/>
    <circle cx="185"  cy="78" r="0.5"/>
    <circle cx="255"  cy="85" r="0.7"/>
    <circle cx="335"  cy="80" r="0.5"/>
    <circle cx="405"  cy="88" r="0.6"/>
    <circle cx="475"  cy="82" r="0.5"/>
    <circle cx="550"  cy="88" r="0.7"/>
    <circle cx="625"  cy="82" r="0.6"/>
    <circle cx="700"  cy="88" r="0.5"/>
    <circle cx="775"  cy="80" r="0.6"/>
    <circle cx="855"  cy="88" r="0.7"/>
    <circle cx="925"  cy="82" r="0.5"/>
    <circle cx="1000" cy="85" r="0.6"/>
    <circle cx="1075" cy="78" r="0.7"/>
    <circle cx="1140" cy="85" r="0.5"/>
  </g>

  <!-- Low silhouette mounds — drawn over the grain so they read as rocks -->
  <ellipse cx="280"  cy="68" rx="200" ry="14" fill="#04080e" opacity="0.85"/>
  <ellipse cx="720"  cy="73" rx="240" ry="18" fill="#04080e" opacity="0.85"/>
  <ellipse cx="1080" cy="66" rx="160" ry="12" fill="#04080e" opacity="0.85"/>

  <!-- Bioluminescence — sparse, irregularly distributed across the
       seabed. Varying x gaps (some near-pairs, some empty
       stretches), varying y, sizes, opacities; two cooler-tinted
       specks mixed in for hue variation. -->
  <circle cx="50"   cy="47" r="0.8" fill="#5eead4" opacity="0.7"/>
  <circle cx="115"  cy="53" r="1.0" fill="#5eead4" opacity="0.85"/>
  <circle cx="195"  cy="43" r="1.2" fill="#5eead4" opacity="0.8"/>
  <circle cx="245"  cy="50" r="0.7" fill="#7dd3c0" opacity="0.6"/>
  <circle cx="380"  cy="46" r="0.9" fill="#5eead4" opacity="0.75"/>
  <circle cx="460"  cy="55" r="0.6" fill="#5eead4" opacity="0.5"/>
  <circle cx="525"  cy="42" r="1.1" fill="#5eead4" opacity="0.8"/>
  <circle cx="695"  cy="49" r="1.3" fill="#5eead4" opacity="0.9"/>
  <circle cx="770"  cy="44" r="0.8" fill="#5eead4" opacity="0.7"/>
  <circle cx="825"  cy="52" r="0.9" fill="#7dd3c0" opacity="0.65"/>
  <circle cx="920"  cy="40" r="1.0" fill="#5eead4" opacity="0.75"/>
  <circle cx="1055" cy="48" r="1.1" fill="#5eead4" opacity="0.85"/>
  <circle cx="1110" cy="43" r="0.7" fill="#5eead4" opacity="0.55"/>
  <circle cx="1175" cy="52" r="0.9" fill="#5eead4" opacity="0.7"/>
</svg>
